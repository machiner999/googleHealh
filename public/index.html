<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Running Tracker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">RUNNING TRACKER</p>
          <h1>ランニングの状況</h1>
          <p class="subtitle">走行中の距離・時間・ペース・ラップをリアルタイムで確認します。</p>
        </div>
      </header>

      <section id="run-view" aria-live="polite">
        <div id="run-notice" class="notice">開始を押すとGPS計測を開始します。走行中はGPSの許可が必要です。</div>
        <section class="run-hero panel">
          <div class="run-status-row">
            <span id="run-state" class="run-state">準備完了</span>
            <span id="gps-status" class="gps-status">GPS 未接続</span>
          </div>
          <div class="run-metrics">
            <div class="run-metric primary"><span>経過時間</span><strong id="run-time">0:00</strong></div>
            <div class="run-metric"><span>走行距離</span><strong><b id="run-distance">0.00</b><small> km</small></strong></div>
            <div class="run-metric"><span>ペース</span><strong><b id="run-pace">—</b><small> /km</small></strong></div>
          </div>
          <div class="run-controls">
            <button id="run-start" class="button run-button start" type="button">計測開始</button>
            <button id="run-pause" class="button run-button pause hidden" type="button">一時停止</button>
            <button id="run-resume" class="button run-button resume hidden" type="button">再開</button>
            <button id="run-stop" class="button secondary run-button hidden" type="button">終了して保存</button>
          </div>
        </section>

        <section class="run-columns">
          <section class="panel">
            <div class="panel-heading">
              <div><p class="eyebrow">KILOMETER LAPS</p><h2>ラップ</h2></div>
              <span id="lap-count" class="legend">0 km</span>
            </div>
            <div id="lap-list" class="lap-list empty-list">1km走るとラップが表示されます。</div>
          </section>
          <section class="panel">
            <div class="panel-heading">
              <div><p class="eyebrow">HISTORY</p><h2>走行履歴</h2></div>
            </div>
            <div id="run-history" class="run-history empty-list">保存された走行履歴はありません。</div>
          </section>
        </section>
      </section>

      <p class="privacy">ランニングのGPS軌跡は保存・送信せず、走行結果とラップ概要だけをこのブラウザに保存します。</p>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
