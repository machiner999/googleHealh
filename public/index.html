<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ランニング記録</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="run-view" aria-label="ランニング計測">
        <section class="run-hero panel">
          <div class="run-status-row">
            <span id="run-state" class="run-state" role="status">準備完了</span>
            <span id="gps-status" class="gps-status" role="status">GPS 未接続</span>
          </div>
          <div class="run-metrics">
            <div class="run-metric primary">
              <span>平均ペース <small>分/km</small></span>
              <strong id="run-pace">—</strong>
            </div>
            <div class="run-metric metric-row"><span>走行距離</span><strong><b id="run-distance">0.00</b><small> km</small></strong></div>
            <div class="run-metric metric-row"><span>経過時間</span><strong id="run-time">0:00</strong></div>
          </div>
          <div class="run-controls">
            <button id="run-start" class="button run-button start" type="button"><span class="button-icon" aria-hidden="true">▶</span><span class="button-label">計測開始</span></button>
            <button id="run-pause" class="button run-button pause hidden" type="button"><span class="button-icon" aria-hidden="true">Ⅱ</span>一時停止</button>
            <button id="run-resume" class="button run-button resume hidden" type="button"><span class="button-icon" aria-hidden="true">▶</span>再開</button>
            <button id="run-stop" class="button secondary run-button hidden" type="button">計測を終了</button>
          </div>
          <div id="run-notice" class="notice" role="status">開始を押すとGPS計測を開始します。走行中はGPSの許可が必要です。</div>
        </section>

        <section class="run-columns">
          <section class="panel lap-chart-panel">
            <div class="panel-heading">
              <div><h2>ラップペース</h2></div>
              <span id="lap-chart-summary" class="legend">—</span>
            </div>
            <div id="lap-chart" class="lap-chart lap-chart-empty" role="img" aria-label="ラップペースのグラフ">
              <span class="lap-chart-placeholder" aria-hidden="true"></span>
              <p>1 km走るとペースの推移が表示されます。</p>
            </div>
          </section>
          <section class="panel">
            <div class="panel-heading">
              <div><h2>1 kmラップ</h2></div>
              <span id="lap-count" class="legend">0 km</span>
            </div>
            <div id="lap-list" class="lap-list empty-list">1km走るとラップが表示されます。</div>
          </section>
        </section>
      </section>

      <p class="privacy">ランニングのGPS軌跡や計測結果は保存・送信しません。ページを閉じると計測結果は消去されます。</p>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
